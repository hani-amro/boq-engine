  - {ar: "أعمال الأكساء والتشطيبات", en: "Finishing works"}
  - {ar: "صافي الكمية", en: "Net quantity — المقاسة من المخطط، وهي المعتمدة للمستخلص"}
  - {ar: "إجمالي الكمية / كمية التوريد", en: "Gross quantity — الصافي + الهدر، للشراء لا للدفع"}
  - {ar: "الهدر / الفاقد / الهالك", en: "Waste allowance"}
  - {ar: "حد الخصم", en: "Deduction threshold — عرف مهني قابل للضبط لا قاعدة معيارية"}
  - {ar: "كشفة / مرتد / رجعة", en: "Reveal / jamb / return"}
  - {ar: "جلسة الشباك", en: "Window sill"}
  - {ar: "عتب الفتحة", en: "Lintel soffit / opening head"}
  - {ar: "كوّة / نيتش", en: "Niche — تُضاف ولا تُخصم"}
  - {ar: "وزرة / نعلة / سكيرتنج", en: "Skirting"}
  - {ar: "عتبة الباب", en: "Threshold / door saddle — بند مستقل لا يدخل في الوزرة"}
  - {ar: "قائم / نائم (قلبة) / أنف الدرجة", en: "Riser / tread / nosing"}
  - {ar: "المسطح المنشور", en: "Developed / girth area"}
  - {ar: "المسطح الأفقي المسقط", en: "Horizontal projected area"}
  - {ar: "قصارة / بياض / لياسة", en: "Plaster / render"}
  - {ar: "طرطشة", en: "Spatterdash / key coat"}
  - {ar: "بؤج ومرابيع", en: "Screed dots and ribs"}
  - {ar: "روبة / فوغة", en: "Grout"}
  - {ar: "رفعة العزل", en: "Waterproofing upstand"}
  - {ar: "تراكب", en: "Overlap / lap — يُغطى بالهدر ولا يُقاس مساحةً"}
  - {ar: "نزلة / بلك هيد", en: "Bulkhead / ceiling drop"}
  - {ar: "التكسير / الطي", en: "ACP edge folding — يستهلك مادة لا تظهر على الواجهة"}
  - {ar: "البيان الحسابي", en: "Measurement breakdown / audit trail"}
  - {ar: "مطالبة مزدوجة", en: "Double counting — الخطر الأول في محرك الحصر"}
  - {ar: "مستخلص", en: "Interim payment certificate"}
