# ---------------------------------------------------------------------------
# جدول أسعار — الخليج (السعودية، الإمارات، قطر، الكويت)
# ---------------------------------------------------------------------------
# هذا الملف بيانات وليس كوداً: المهندس يعدّله بنفسه دون لمس بايثون.
#
# ⚠️ تحذير — كل رقم هنا يتحوّل مباشرة إلى مال في عرض السعر.
#
# قاعدة الإصدارات (مهمة قانونياً):
#   * جدول الأسعار المنشور لا يُعدَّل في مكانه أبداً. أي تغيير في فئة واحدة =
#     ملف جديد بإصدار (version) جديد، مثل: gulf-v1.1.0.yaml
#   * السبب: كل عرض سعر يسجّل «المُعرّف + الإصدار + بصمة المحتوى» الذي سُعّر به،
#     حتى يمكن إعادة إنتاج عرض عمره سنتان بالقرش الواحد أمام لجنة أو محكمة.
#     إذا عُدِّل ملف منشور، ستكشفه الدالة verify_reproducible وتُعلن كسر التطابق.
#   * الاكتشاف يتم بمحتوى الملف (meta.region + meta.version) لا باسمه؛ الاسم
#     للراحة البشرية فقط.
#
# معنى الحقول:
#   material_rate : فئة المواد للوحدة الواحدة بعملة meta.currency.
#   labor_rate    : فئة العمالة (التركيب/التنفيذ) للوحدة الواحدة.
#   unit          : يجب أن تطابق وحدة البند في core/rules/finishes.yaml تماماً،
#                   وإلا رُفض التسعير بخطأ صريح (ضرب كمية بوحدة مختلفة = رقم بلا معنى).
#   waste_in_rate : true (الافتراضي) يعني أن نسبة الهدر مُحتسَبة داخل فئة المواد،
#                   فتُسعَّر المواد على الكمية الصافية المدفوعة في المستخلص.
#                   false يعني فئة توريد صافية، فتُسعَّر المواد على كمية التوريد
#                   (الصافي + الهدر) وإلا دفع المقاول الهدر من جيبه.
# ---------------------------------------------------------------------------

meta:
  schema: price-book/1
  id: gulf-base
  region: gulf
  currency: "SAR"
  version: "0.1.0"
  effective_date: "2026-07-26"

  # ⚠️ العلامة التي تمنع إرسال هذا الجدول إلى عميل. تُقرأ برمجياً في
  # core/pricing.py (assert_client_ready) فترفض الواجهة إصدار عرض للعميل.
  # لا تجعلها false إلا بعد إدخال فئات المكتب الحقيقية المسعّرة من السوق.
  is_placeholder: true

  placeholder_warning_ar: >-
    ⚠️ تحذير: جميع الفئات في هذا الجدول أرقام أولية (PLACEHOLDER) موضوعة لتشغيل
    النظام واختباره فقط، وليست أسعار سوق ولا تصلح لأي التزام تعاقدي. يجب أن
    يستبدلها المعماري بفئات مكتبه الحقيقية المسعّرة من الموردين والمقاولين قبل
    إرسال أي عرض سعر إلى عميل. إرسال عرض مبني على هذه الأرقام مسؤولية مباشرة
    على المكتب.

  source_note_ar: >-
    أرقام أولية للتشغيل فقط. اشتُقّت حسابياً من الجدول الشامي بتحويل 3.75 ريال
    للدولار مع رفع فئة المواد 10% (كلفة الاستيراد والشحن) وخفض فئة العمالة 15%،
    وهي بذلك تقدير مكتبي وليست تسعيراً من السوق الخليجي. يجب أن يستبدلها المكتب
    بفئات مسعّرة من موردي المنطقة ومقاوليها قبل أي استعمال تجاري.

  defaults:
    # الهدر محتسب داخل فئة المواد افتراضياً — العرف السائد في المنطقة.
    waste_in_rate: true

  fx:
    # عملات الخليج مربوطة بالدولار بسعر ثابت، فلا حاجة لمرساة: الفئات مخزَّنة
    # بالريال السعودي مباشرة. للفوترة بالدرهم أو الريال القطري مرّر FxRate عادية.
    is_anchor: false
    requires_conversion: false
    note_ar: >-
      لا يوجد تقلّب عملة يُذكر في نطاق هذا الجدول؛ خانة سعر الصرف متاحة فقط
      للفوترة بعملة خليجية أخرى (AED / QAR / KWD).

